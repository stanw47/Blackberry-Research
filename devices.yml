# Blackberry-Research collection index (machine-readable).
# The hub toolchain/sync-hub.sh reads this to build the master table.
# Keep in sync with each device repo's SUMMARY.md.

collection:
  hub: https://github.com/stanw47/Blackberry-Research
  model: "hub + one repo per device"
  visibility_default: private
  standard: templates/
  devmap_standard: devmap/STANDARD.md

devices:
  - id: classic
    name: BlackBerry Classic
    model: SQC100 (Q20)
    soc: MSM8960
    os: BB10 / QNX 10.3.3.3216
    repo: https://github.com/stanw47/Blackberry-Classic-Research
    visibility: private
    access: [usb, fastboot, adb, qnx]
    status: "rooted (uid-0), bootable; bootloader unlock HW write-protect gated"
    headline: "real uid-0 via pathtrust !__root; boot0 WP permanent (B_PERM_WP_EN)"
    has_devmap: true

